name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check package version
    runs-on: ubuntu-latest

    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read package metadata
        id: package
        run: |
          PACKAGE_NAME=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          PACKAGE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm tag matches package version
        if: github.ref_type == 'tag'
        run: |
          EXPECTED_TAG="v${{ steps.package.outputs.version }}"
          if [ "${{ github.ref_name }}" != "$EXPECTED_TAG" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version ${{ steps.package.outputs.version }}."
            echo "Expected tag: $EXPECTED_TAG"
            exit 1
          fi

      - name: Confirm version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          STATUS=$(python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          package_name = os.environ["PACKAGE_NAME"]
          package_version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package_name}/{package_version}/json"

          try:
              with urllib.request.urlopen(url) as response:
                  print(response.status)
          except urllib.error.HTTPError as error:
              print(error.code)
          PY
          )

          if [ "$STATUS" = "200" ]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published on PyPI."
            exit 1
          fi

          if [ "$STATUS" != "404" ]; then
            echo "Unexpected PyPI response while checking ${PACKAGE_NAME}@${PACKAGE_VERSION}: HTTP ${STATUS}"
            exit 1
          fi

          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Compile Python sources
        run: uv run python -m compileall src

      - name: Build package
        run: uv build --out-dir dist

      - name: Verify built metadata
        env:
          PACKAGE_NAME: ${{ needs.preflight.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.preflight.outputs.package_version }}
        run: |
          python3 - <<'PY'
          import email.parser
          import os
          import pathlib
          import zipfile

          package_name = os.environ["PACKAGE_NAME"]
          package_version = os.environ["PACKAGE_VERSION"]
          dist_dir = pathlib.Path("dist")
          wheels = sorted(dist_dir.glob("*.whl"))
          sdists = sorted(dist_dir.glob("*.tar.gz"))

          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, got wheels={wheels}, sdists={sdists}")

          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_name = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.parser.Parser().parsestr(wheel.read(metadata_name).decode())

          if metadata["Name"] != package_name:
              raise SystemExit(f"Wheel name {metadata['Name']} does not match {package_name}")

          if metadata["Version"] != package_version:
              raise SystemExit(f"Wheel version {metadata['Version']} does not match {package_version}")

          print(f"Built {package_name} {package_version}:")
          print(f"- {wheels[0]}")
          print(f"- {sdists[0]}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    environment:
      name: pypi
      url: https://pypi.org/p/unichat-mcp-server
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
